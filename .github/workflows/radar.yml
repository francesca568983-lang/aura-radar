name: Radar dei bandi
on:
  schedule:
    - cron: '30 4 * * *'      # ogni giorno alle 6:30 italiane
  workflow_dispatch:
permissions:
  contents: write
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - run: python3 radar.py
      - name: Salva i dati
        run: |
          git config user.name "aura-radar"
          git config user.email "aura-radar@users.noreply.github.com"
          git add data
          git commit -m "Radar $(date -u +%F)" || echo "niente di nuovo"
          git push
